plugin:
  name: fylr-plugin-editor-tagfilter-defaults
  version: "1.0"
  url: https://github.com/programmfabrik/fylr-plugin-editor-tagfilter-defaults
  displayname:
    en-US: "Default Values Plugin"
    de-DE: "Standardwerte Plugin"
  info:
    de-DE: Setzt im Editor Standardwerte für Felder abhängig vom aktiven Tag-Filter. Nützlich, wenn je nach Tag unterschiedliche Vorgabewerte vorbelegt werden sollen.
    en-US: Sets field defaults in the editor based on the active tag filter. Useful when different tags should pre-fill different default values.
  l10n: l10n/fylr-plugin-editor-tagfilter-defaults.csv
  webfrontend:
    url: fylr-plugin-editor-tagfilter-defaults.js

base_url_prefix: "webfrontend"

base_config:
  - name: editor-tagfilter-defaults
    group: editor
    parameters:
      filters:
        type: table
        fields:
          - name: "operation"
            type: string-list
            label_choice: "operation"
            choices:
              - update
              - insert
            position: 0
          - name: "mask_id"
            type: "int"
            plugin_type: "mask-select"
            position: 1
          - name: "pool_id"
            type: "text"
            store_as_json: true
            plugin_type: "pool-select"
            position: 2
          - name: "tagfilter"
            type: "text"
            store_as_json: true
            plugin_type: "tag-filter"
            position: 3
          - name: "default"
            type: "text"
            store_as_json: true
            plugin_type: "column-default-value"
            position: 4
        position: 0
